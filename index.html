<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mis Tareas</h1>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Escribe una tarea...">
            <button id="addBtn">Añadir</button>
        </div>
        <p id="errorMsg" class="error">Por favor, escribe una tarea.</p>
        <ul id="taskList">
            <!-- Las tareas se añadirán aquí con JS -->
        </ul>
        <!-- Nuevo contador de tareas -->
        <div class="task-counter">
            <span id="taskCount">0</span> tareas pendientes
        </div>
        <button id="clearCompletedBtn" class="clear-btn">Borrar completadas</button>
        <div class="filters">
            <button class="filter-btn" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Activas</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
